# ========================
# SERVER
# ========================
server.port=8080

# ========================
# DATABASE H2 (file mode)
# ========================
spring.datasource.url=jdbc:h2:file:./ironzone-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin

# Console H2 accessibile da browser: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ========================
# JPA / HIBERNATE
# ========================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# create-drop: ricrea le tabelle ad ogni avvio (utile in sviluppo)
# update: aggiorna le tabelle senza cancellarle (utile in produzione)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========================
# JWT
# ========================
# Chiave segreta per firmare i token (cambiala in produzione!)
jwt.secret=ironzone-super-secret-key-2025-cambia-in-produzione
# Durata token: 24 ore in millisecondi
jwt.expiration=86400000

# ========================
# CORS
# ========================
cors.allowed-origins=http://localhost:4200
