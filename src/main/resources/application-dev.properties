cors.allowed-origins=http://localhost:4200,http://localhost:5500,http://127.0.0.1:5500,null

#Database configuration for development deployment (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/aurea-db
spring.datasource.username=postgres-saba
spring.datasource.password=postgres-saba
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true